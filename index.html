<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f7fb" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./src/style/style.css" />
    <title>JRonda - Transit Kiosk</title>
</head>
<body>
  <div id="kiosk-root">
    <div id="kiosk-map-wrap">
      <div id="kiosk-map-surface">
        <svg id="map" viewBox="0 0 1000 1000" tabindex="-1"></svg>
      </div>
      <div id="map-legend-dock"><!-- Legend dock --></div>
    </div>
  <div id="kiosk-sidebar">
      <!-- Sidebar controls will populate here -->
      <button id="jronda-update-data" class="hidden-admin-btn" title="Update GTFS data (admin)" style="
        position: fixed; top: 10px; right: 10px; z-index: 1000;
        padding: 8px 12px; background: #059669; color: white; border: none;
        border-radius: 6px; font-size: 12px; cursor: pointer;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      ">⟳ Update Data</button>
    </div>
  </div>

  <div id="jronda-toast-root"></div>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
  <script type="module">
    import './src/core/bootstrap.js';
    import './src/core/render.js';
    import './src/core/ui.js';
    import './src/core/kioskSecurity.js';
    import './src/core/interaction.js';
    
    // Debug mode from URL param
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('debug')) {
      window.addEventListener('load', () => {
        setTimeout(() => {
          const debugBtn = document.getElementById('jronda-layout-debug');
          if (debugBtn && typeof window.toggleLayoutDebug === 'function') {
            window.toggleLayoutDebug();
          }
          console.log('Auto-enabled layout debug (?debug=1)');
        }, 2000);
      });
    }
    
    // Initialize after all modules loaded
    window.addEventListener('load', () => {
      console.log('JRonda kiosk loaded');
    });
  </script>
</body>
</html>
