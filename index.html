<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./src/style/kiosk.css" />
  <title>JRonda – Render Test</title>
</head>
<body style="margin:0;padding:0;height:100vh;overflow:hidden;">
  <div id="kiosk-root">
    <div id="kiosk-map-wrap">
      <div id="kiosk-map-surface">
        <svg id="map" viewBox="0 0 1000 1000" tabindex="-1"></svg>
      </div>
      <div id="map-legend-dock"><!-- Legend dock --></div>
    </div>
    <div id="kiosk-sidebar">
      <!-- Sidebar controls will populate here -->
    </div>
  </div>

  <div id="jronda-toast-root"></div>
  <div id="station-tooltip"></div>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
  <script type="module">
    import './src/core/bootstrap.js';
    import './src/core/render.js';
    import './src/core/ui.js';
    import './src/core/kioskSecurity.js';
    import './src/core/interaction.js';
    
    // Initialize after all modules loaded
    window.addEventListener('load', () => {
      console.log('JRonda kiosk loaded');
    });
  </script>
</body>
</html>
